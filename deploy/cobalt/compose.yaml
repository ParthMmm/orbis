services:
  cobalt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YOUTUBEI_VERSION: "18.0.0"
    # Built from the Dockerfile, which pins the upstream image by digest and
    # swaps its vendored youtubei.js for the release that has VISIONOS.
    image: orbis-cobalt:11.7.1-youtubei18.0.0
    platform: linux/amd64
    init: true
    read_only: true
    restart: unless-stopped
    container_name: orbis-cobalt-trial
    ports:
      - "${VANTA_TAILSCALE_IP:?VANTA_TAILSCALE_IP must be set}:9000:9000/tcp"
    environment:
      API_URL: "${COBALT_API_URL:?COBALT_API_URL must be set}"
      API_KEY_URL: "file:///keys.json"
      API_AUTH_REQUIRED: "1"
      # VISIONOS is the only client Cobalt can reach whose stream URLs YouTube
      # serves in full. Every other one returns 403 past roughly the first MiB.
      CUSTOM_INNERTUBE_CLIENT: "VISIONOS"
      DISABLED_SERVICES: "bilibili,bsky,dailymotion,facebook,instagram,loom,newgrounds,ok,pinterest,reddit,rutube,snapchat,streamable,tiktok,tumblr,twitch,twitter,vimeo,vk"
      DURATION_LIMIT: "21600"
      RATELIMIT_WINDOW: "60"
      RATELIMIT_MAX: "10"
      SESSION_RATELIMIT_WINDOW: "60"
      SESSION_RATELIMIT_MAX: "10"
      TUNNEL_RATELIMIT_WINDOW: "60"
      TUNNEL_RATELIMIT_MAX: "20"
    volumes:
      - ./keys.json:/keys.json:ro

name: Orbis
options:
  bundleIdPrefix: app.orbis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  OrbisDesign:
    path: OrbisDesign
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    # Signing is stated here because this file is the source the project is generated from, and
    # the project itself is gitignored. Setting a team in Xcode writes it into a file that the
    # next `xcodegen generate` replaces, which is why the team kept disappearing. The lanes still
    # override on the command line: ad-hoc signing for a Mac build, and ad-hoc signing for the
    # simulator, which is what gives the lane build the entitlement its keychain needs.
    DEVELOPMENT_TEAM: JR398S689Z
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The client talks to the server over the tailnet, which uses a real certificate.
    # Local networking is allowed so lanes can run against a temporary loopback server.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
targets:
  Orbis:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Orbis
    dependencies:
      - package: OrbisDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orbis.client
        PRODUCT_NAME: Orbis
        INFOPLIST_KEY_CFBundleDisplayName: Orbis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Playback continues with the screen locked. macOS ignores this key.
        INFOPLIST_KEY_UIBackgroundModes: [audio]
  OrbisTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - OrbisTests
    dependencies:
      - target: Orbis
      - package: OrbisDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orbis.client.tests
        # A multiplatform unit test bundle needs the host path per platform. xcodegen
        # writes the flat iOS layout for both, and the macOS bundle puts the binary
        # under Contents/MacOS, so the SDK condition supplies the right one.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Orbis.app/Contents/MacOS/Orbis"
        BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"
  OrbisUITests:
    type: bundle.ui-testing
    # iOS only. The macOS UI test runner is killed before bootstrap on the host that runs
    # the lanes, so macOS is verified by the unit tests on the macOS destination and by
    # reading the running app through accessibility.
    supportedDestinations: [iOS]
    sources:
      - OrbisUITests
    dependencies:
      - target: Orbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orbis.client.uitests
schemes:
  Orbis:
    build:
      targets:
        Orbis: all
        OrbisTests: [test]
        OrbisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrbisTests
        - OrbisUITests
      environmentVariables:
        # A hosted test run must never read the device's own pairing, so the whole run is put
        # on in-memory settings. The app's own default model picks this up before any test
        # method runs; the Debug factory also fails closed on a recognized test host.
        ORBIS_TEST_SETTINGS: memory
        # Substituted at generation time, so the lane's temporary service is what the
        # journey tests type into the connection screen.
        ORBIS_UI_TEST_ADDRESS: ${ORBIS_UI_TEST_ADDRESS}
        ORBIS_UI_TEST_TOKEN: ${ORBIS_UI_TEST_TOKEN}
